<!doctype html>
<html lang="zh-CN" data-theme="sky">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="我的应用与书签导航"><title>我的导航</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/themes.css">
  <script src="/lunar.js" defer></script>
  <script type="module" src="/home.js"></script>
</head>
<body class="home layer">
  <a class="skip-link" href="#resources">跳至资源</a>
  <div class="page-shell">
    <nav class="topbar" aria-label="站点导航">
      <a class="brand" href="/"><span id="brand-logo" class="brand-logo" data-brand-logo><img src="/brand/logo.svg" width="40" height="40" alt=""></span><span id="site-name" data-site-name>我的导航</span></a>
      <div class="top-actions"><a href="/admin.html" class="icon-button" aria-label="管理后台" title="管理后台" data-icon="settings-2"></a></div>
    </nav>
    <main>
      <section id="overview" class="overview layer" aria-labelledby="overview-label">
        <div class="overview-left"><div class="eyebrow"><span data-icon="sun-moon"></span><h1 id="overview-label">今日概览</h1></div>
          <div class="clock" aria-label="当前时间"><span id="time">--:--</span><span id="seconds" class="seconds">--</span></div>
          <div class="muted date"><span id="date"></span><span id="lunar-date" class="lunar-date"></span></div><p id="greeting" class="greeting">欢迎回来</p>
        </div>
        <div class="overview-right">
          <div class="visitor-weather">
            <div class="weather"><div id="weather-icon" class="weather-icon" data-icon="cloud-sun"></div><div><button id="weather-city" class="city-button" type="button" title="切换天气城市">天气 <span data-icon="chevron-down"></span></button><strong id="weather-value">正在获取</strong><small id="weather-source" class="muted"></small></div></div>
            <div class="visitor"><div class="visitor-place"><span data-icon="map-pin"></span><span id="visitor-location" class="visitor-location">正在定位…</span></div><button id="visitor-ip" class="ip-button" type="button" title="显示完整 IP" aria-pressed="false" disabled>IP · --</button><small id="visitor-isp" class="muted"></small></div>
          </div>
          <form id="search-form" class="search-area" role="search">
            <div id="search-scope" class="search-options" role="radiogroup" aria-label="搜索范围"><button type="button" role="radio" data-scope="web" aria-checked="true"><span data-icon="globe"></span>网页</button><button type="button" role="radio" data-scope="apps" aria-checked="false" tabindex="-1"><span data-icon="layout-grid"></span>应用</button><button type="button" role="radio" data-scope="bookmarks" aria-checked="false" tabindex="-1"><span data-icon="bookmark"></span>书签</button></div>
            <div class="search-box"><span data-icon="search"></span><input id="query" type="search" role="combobox" aria-label="搜索内容" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false" placeholder="今天想找点什么？" autocomplete="off"><button id="clear-search" class="icon-button" type="button" title="清空搜索" aria-label="清空搜索" data-icon="x" hidden></button><label id="search-engine-field" class="search-engine-field"><span class="sr-only">搜索引擎</span><select id="search-engine"><option value="google">Google</option><option value="baidu">百度</option><option value="bing">Bing</option></select><span data-icon="chevron-down"></span></label><button class="primary icon-button" type="submit" title="搜索" aria-label="搜索" data-icon="arrow-right"></button></div><div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="搜索联想" hidden></div>
          </form>
        </div>
      </section>
      <section id="resources" class="resources layer" aria-labelledby="resources-title">
        <div class="section-heading"><div><h2 id="resources-title">资源<span id="resource-count" class="count">--</span></h2></div><div class="segmented" id="collection-tabs" role="tablist" aria-label="资源类型"><button id="apps-tab" type="button" role="tab" data-type="apps" aria-selected="true" aria-controls="content"><span data-icon="layout-grid"></span>应用</button><button id="bookmarks-tab" type="button" role="tab" data-type="bookmarks" aria-selected="false" aria-controls="content" tabindex="-1"><span data-icon="bookmark"></span>书签</button></div></div>
        <div id="filters" class="filter-row"><label class="category-field"><span class="sr-only">分类</span><span data-icon="sliders-horizontal"></span><select id="category-filter"><option value="">全部分类</option></select></label><div id="tag-filters" class="tag-filters" aria-label="标签筛选"></div><div class="filter-summary"><span id="results-status" class="muted" role="status"></span><button id="reset-filters" type="button" class="reset-filters" hidden>重置</button></div></div>
        <div id="content" role="tabpanel" aria-labelledby="apps-tab"><p class="empty">正在加载资源…</p></div>
      </section>
    </main>
    <footer><div class="footer-brand"><span class="brand-logo" data-brand-logo><img src="/brand/logo.svg" width="20" height="20" alt=""></span><span id="footer-text">我的导航 · 把日常收藏在这里</span></div><span class="footer-mark">LET'S FIND SOMETHING GOOD.</span></footer>
  </div>
  <dialog id="city-dialog"><div class="dialog-header"><h2>天气城市</h2><button type="button" data-close class="icon-button" title="关闭" aria-label="关闭" data-icon="x"></button></div><form id="city-search"><label for="city-query">城市名称</label><div class="inline-field"><input id="city-query" required minlength="2" maxlength="80" placeholder="例如：上海 / Shanghai"><button type="submit" class="primary icon-button" aria-label="查找城市" title="查找城市" data-icon="search"></button></div></form><p id="city-error" class="muted" role="status"></p><div id="city-results"></div><button id="city-automatic" type="button" class="button secondary">使用 IP 自动定位</button></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
