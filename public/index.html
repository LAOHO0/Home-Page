<!doctype html>
<html lang="zh-CN" data-theme="sky">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="我的应用与书签导航"><title>我的导航</title>
  <link rel="icon" href="/icons/compass.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/themes.css">
  <script src="/lunar.js" defer></script>
  <script type="module" src="/home.js"></script>
</head>
<body class="home layer">
  <a class="skip-link" href="#resources">跳至资源</a>
  <div class="page-shell">
    <nav class="topbar" aria-label="站点导航">
      <a class="brand" href="/"><span id="brand-logo" class="brand-logo" data-icon="compass"></span><span id="site-name">我的导航</span></a>
      <div class="top-actions"><a href="/admin.html" class="icon-button" aria-label="管理后台" title="管理后台" data-icon="settings-2"></a></div>
    </nav>
    <main>
      <section id="overview" class="overview layer" aria-labelledby="overview-label">
        <div class="overview-left"><div class="eyebrow"><span class="status-dot"></span><h1 id="overview-label">今日概览</h1></div>
          <div class="clock" aria-label="当前时间"><span id="time">--:--</span><span id="seconds" class="seconds">--</span></div>
          <div class="muted date"><span id="date"></span><span id="lunar-date" class="lunar-date"></span></div><p id="greeting" class="greeting">欢迎回来</p>
        </div>
        <div class="overview-right">
          <div class="visitor-weather">
            <div class="weather"><div id="weather-icon" class="weather-icon" data-icon="cloud-sun"></div><div><button id="weather-city" class="city-button" type="button" title="切换天气城市">天气 <span data-icon="chevron-down"></span></button><strong id="weather-value">正在获取</strong><small id="weather-source" class="muted"></small></div></div>
            <div class="visitor"><span id="visitor-location" class="visitor-location">正在定位…</span><button id="visitor-ip" class="ip-button" type="button" title="显示完整 IP" disabled>IP · --</button><small id="visitor-isp" class="muted"></small></div>
          </div>
          <form id="search-form" class="search-area" role="search">
            <div class="search-options"><label class="sr-only" for="search-scope">搜索范围</label><select id="search-scope"><option value="web">搜索网页</option><option value="apps">搜索应用</option><option value="bookmarks">搜索书签</option></select>
              <label class="sr-only" for="search-engine">搜索引擎</label><select id="search-engine"><option value="google">Google</option><option value="baidu">百度</option><option value="bing">Bing</option></select></div>
            <div class="search-box"><span data-icon="search"></span><input id="query" type="search" aria-label="搜索内容" placeholder="今天想找点什么？" autocomplete="off"><button id="clear-search" class="icon-button" type="button" title="清空搜索" aria-label="清空搜索" data-icon="x" hidden></button><button class="primary icon-button" type="submit" title="搜索" aria-label="搜索" data-icon="arrow-right"></button></div><div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="搜索联想" hidden></div>
          </form>
        </div>
      </section>
      <section id="resources" class="resources layer" aria-labelledby="resources-title">
        <div class="section-heading"><div><h2 id="resources-title">资源<span id="resource-count" class="count">--</span></h2><p class="muted">我的在线应用与收藏站点</p></div><div class="segmented" id="collection-tabs" role="tablist" aria-label="资源类型"><button id="apps-tab" role="tab" data-type="apps" aria-selected="true" aria-controls="content">应用</button><button id="bookmarks-tab" role="tab" data-type="bookmarks" aria-selected="false" aria-controls="content" tabindex="-1">书签</button></div></div>
        <div id="filters" class="filter-row"><label class="sr-only" for="category-filter">分类</label><select id="category-filter"><option value="">全部分类</option></select><div id="tag-filters" class="tag-filters" aria-label="标签筛选"></div><span id="results-status" class="muted" role="status"></span></div>
        <div id="content" role="tabpanel" aria-labelledby="apps-tab"><p class="empty">正在加载资源…</p></div>
      </section>
    </main>
    <footer><span id="footer-text">我的导航 · 把日常收藏在这里</span><span class="footer-mark">LET'S FIND SOMETHING GOOD.</span></footer>
  </div>
  <dialog id="city-dialog"><div class="dialog-header"><h2>天气城市</h2><button type="button" data-close class="icon-button" title="关闭" aria-label="关闭" data-icon="x"></button></div><form id="city-search"><label for="city-query">城市名称</label><div class="inline-field"><input id="city-query" required minlength="2" maxlength="80" placeholder="例如：上海 / Shanghai"><button type="submit" class="primary icon-button" aria-label="查找城市" title="查找城市" data-icon="search"></button></div></form><p id="city-error" class="muted" role="status"></p><div id="city-results"></div><button id="city-automatic" type="button" class="button secondary">使用 IP 自动定位</button></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
